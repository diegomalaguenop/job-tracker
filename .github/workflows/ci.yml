name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python / Backend ────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Start FastAPI server
        working-directory: backend
        run: uvicorn app.main:app --host 127.0.0.1 --port 8000 &

      # ── Node / Frontend ─────────────────────────────────────────────────────
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Start Vite dev server
        working-directory: frontend
        run: npm run dev &

      # ── Playwright ──────────────────────────────────────────────────────────
      - name: Install Playwright dependencies
        working-directory: tests
        run: |
          npm install
          npx playwright install chromium --with-deps

      # ── Wait for both servers ───────────────────────────────────────────────
      - name: Wait for FastAPI (localhost:8000)
        run: |
          echo "Waiting for FastAPI..."
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:8000/health > /dev/null; do sleep 1; done'
          echo "FastAPI ready ✓"

      - name: Wait for Vite (localhost:5173)
        run: |
          echo "Waiting for Vite..."
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:5173 > /dev/null; do sleep 1; done'
          echo "Vite ready ✓"

      # ── Tests ───────────────────────────────────────────────────────────────
      - name: Run Playwright tests
        working-directory: tests
        run: npx playwright test

      # ── Artifacts ───────────────────────────────────────────────────────────
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always() # upload even if tests fail
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
